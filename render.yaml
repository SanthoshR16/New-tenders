services:
  - type: web
    name: san-tender-decision-server
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEVELOPER_ACCESS_CODE
        sync: false
      - key: KAMAL_SIR_ACCESS_CODE
        sync: false
      - key: UDAY_SIR_ACCESS_CODE
        sync: false
      - key: RELAY_API_TOKEN
        sync: false
